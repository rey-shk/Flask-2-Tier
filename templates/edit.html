{% extends 'base.html' %}
{% block title %}Edit Item{% endblock %}
{% block content %}
<h2>Edit Item</h2>
<form method="post">
    <label>Name:</label>
    <input type="text" name="name" value="{{ item.name }}" required />
    <label>Description:</label>
    <textarea name="description">{{ item.description }}</textarea>
    <input type="submit" value="Update" />
</form>
{% endblock %}
