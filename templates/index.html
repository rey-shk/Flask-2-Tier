{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
<h2>Items</h2>
<ul>
{% for item in items %}
<li>
  {{ item.name }} - {{ item.description }}
  <a href="{{ url_for('edit', id=item.id) }}">Edit</a>
  <form action="{{ url_for('delete', id=item.id) }}" method="post" style="display:inline;">
    <button type="submit">Delete</button>
  </form>
</li>
{% endfor %}
</ul>
{% endblock %}
